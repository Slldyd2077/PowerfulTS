map $http_x_forwarded_proto $powerfults_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;

    # 静态资源长缓存（带 hash 的构建产物）
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由回退（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入场音效是唯一需要接收 10 MiB 请求体的 API，不放宽其他端点。
    location = /api/music/voice/entry-sound {
        # 自定义入场音效上限为 10 MiB，保留少量请求开销余量。
        client_max_body_size 11m;
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $powerfults_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # API 反代到后端容器（compose 服务名 backend）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        # Preserve an exposed port (for example :8080) so the backend can hand
        # TSMusicBot a callback URL that is actually reachable.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $powerfults_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 图片代理 / 流式响应关闭缓冲
        proxy_buffering off;
    }
}
