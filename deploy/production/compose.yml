# Existing Linux production host: API and TSMusicBot run under systemd.
# Uses the existing full nginx.conf (port 5173, API at 127.0.0.1:8001).
# docker compose -f /opt/powerfults/deploy/compose.production.yml up -d --wait
name: powerfults-production

services:
  frontend:
    image: ghcr.io/slldyd2077/powerfults-frontend:${POWERFULTS_VERSION:-1.1.3}
    container_name: powerfults-web
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/powerfults/deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
